<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gibs FC · Classificação, Rodadas e Ranking</title>
  <link rel="icon" href="/gibs-logo.avif" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/gibs.css" />
</head>
<body data-page="publico">
  <header data-gibs-masthead></header>

  <main class="wrap">
    <div class="tabs">
      <button data-tab="classificacao" class="ativo">Classificação</button>
      <button data-tab="rodadas">Rodadas</button>
      <button data-tab="ranking">Ranking</button>
    </div>
    <div id="conteudo"><div class="estado"><div class="spinner"></div>Carregando dados do Gibs FC…</div></div>
    <div class="rodape" id="updated" style="border:0"></div>
  </main>

  <footer class="rodape">Gibs FC · <a href="inicio.html">Início</a> · <a href="loja.html">Loja</a></footer>

  <div id="modal-root"></div>

  <script src="/assets/gibs.js"></script>
  <script>
    let ESTADO = null;
    const conteudo = document.getElementById("conteudo");
    const G = () => window.GIBS;

    function tagPos(pos) { return G().POS[pos] ? '<span class="tag ' + G().POS[pos].cls + '">' + G().POS[pos].abrev + "</span>" : ""; }
    function legendaPos(fim) {
      const itens = Object.keys(G().POS).map((k) => '<span><span class="tag ' + G().POS[k].cls + '">' + G().POS[k].abrev + "</span> " + G().POS[k].rotulo + "</span>").join("");
      return '<div class="legenda">' + itens + '<span class="fim">' + fim + "</span></div>";
    }
    const badgePos = (i) => i === 0 ? "background:linear-gradient(135deg,#fbbf24,#d97706);color:#3a2500" : i === 1 ? "background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#1e293b" : i === 2 ? "background:linear-gradient(135deg,#e0a26a,#a15a1e);color:#fff" : "background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)";
    const accPos = (i) => i === 0 ? "background:var(--gold)" : i === 1 ? "background:rgba(255,255,255,.5)" : i === 2 ? "background:#c07a3a" : "background:var(--red)";
    const delay = (i) => 'style="animation-delay:' + Math.min(i * 45, 600) + 'ms;';

    function renderClassificacao(e) {
      const lista = G().classificacao(e);
      if (!lista.length) return '<div class="board"><div class="vazio">Nenhuma rodada registrada ainda.</div></div>';
      const camp = G().campeoesPorId(e);
      const linhas = lista.map((l, i) =>
        '<div class="row ' + (i === 0 ? "lider " : "") + (i < 3 ? "top3" : "") + '" ' + delay(i) + '">' +
        '<span class="acc" style="' + accPos(i) + '"></span><span class="posn" style="' + badgePos(i) + '">' + (i + 1) + "</span>" +
        '<span class="nome">' + G().esc(l.jogador.nome) + G().coroa(camp, l.jogador.id) + " " + tagPos(l.jogador.posicao) + "</span>" +
        '<span class="w-big pts">' + l.pontos + '</span><span class="w-num">' + l.v + '</span><span class="w-num">' + l.em + '</span><span class="w-num">' + l.d + '</span><span class="w-num" style="color:var(--muted-2)">' + l.j + "</span></div>"
      ).join("");
      return '<div class="board"><div class="meta">Gibs FC · ' + G().esc(G().nomeMes(e.mes)) + '</div><h2>Classificação <span>Mensal</span></h2>' +
        '<div class="cols"><span style="width:28px;text-align:center;flex-shrink:0">#</span><span style="flex:1">Jogador</span><span class="w-big" style="color:var(--gold)">Pts</span><span class="w-num">V</span><span class="w-num">E</span><span class="w-num">D</span><span class="w-num">J</span></div>' +
        linhas + legendaPos("Vitória = 3 pts · Empate = 1 pt") + "</div>";
    }

    function renderRanking(e) {
      const lista = G().ranking(e);
      if (!lista.length) return '<div class="board"><div class="vazio">Sem partidas registradas para gerar notas.</div></div>';
      const camp = G().campeoesPorId(e);
      const linhas = lista.map((l, i) => {
        const mov = l.mov > 0 ? '<span class="up">▲ ' + l.mov + "</span>" : l.mov < 0 ? '<span class="down">▼ ' + Math.abs(l.mov) + "</span>" : '<span class="flat">—</span>';
        return '<div class="row ' + (i === 0 ? "lider " : "") + (i < 3 ? "top3" : "") + '" ' + delay(i) + '">' +
          '<span class="acc" style="' + accPos(i) + '"></span><span class="posn" style="' + badgePos(i) + '">' + (i + 1) + "</span>" +
          '<span class="w-mov">' + mov + '</span><span class="nome nome-link" data-jogador="' + l.jogador.id + '" title="Ver ficha do jogador">' + G().esc(l.jogador.nome) + G().coroa(camp, l.jogador.id) + " " + tagPos(l.jogador.posicao) + "</span>" +
          '<span class="w-big pts">' + l.stats.nota.toFixed(1) + '</span><span class="w-num">' + l.stats.v + '</span><span class="w-num" style="color:var(--muted-2)">' + l.stats.d + '</span><span class="w-num" style="color:var(--muted-2)">' + l.stats.j + '</span><span class="w-seq">' + G().seqBadge(l.stats) + "</span></div>";
      }).join("");
      const board = '<div class="board"><div class="meta">Gibs FC · Notas 6–10</div><h2>Ranking <span>Jogadores</span></h2>' +
        '<div class="cols"><span style="width:28px;text-align:center;flex-shrink:0">#</span><span class="w-mov">Mov</span><span style="flex:1">Jogador</span><span class="w-big" style="color:var(--gold)">Nota</span><span class="w-num">V</span><span class="w-num">D</span><span class="w-num">J</span><span class="w-seq">Seq</span></div>' +
        linhas + legendaPos("Vitórias seguidas +0,2/+0,3/+0,4… · Derrotas seguidas −0,1/−0,2… · Campeão +0,5 · Faltou −0,1 · piso 6") + "</div>";
      return board + renderDestaques(e, lista, camp) + renderComoFunciona();
    }

    // Resumo detalhado de como a nota é calculada.
    function renderComoFunciona() {
      const regras = [
        ["pt-up", "🔥", "Vitória em sequência", 'A 1ª vitória vale <b>+0,2</b>, a 2ª seguida <b>+0,3</b>, a 3ª <b>+0,4</b>… quanto mais embalado, mais a nota sobe (sem teto por vitória).'],
        ["pt-down", "❄️", "Derrota em sequência", 'A 1ª derrota tira <b>−0,1</b>, a 2ª seguida <b>−0,2</b>, a 3ª <b>−0,3</b>… a má fase pesa cada vez mais.'],
        ["pt-neutro", "🤝", "Empate", 'É <b>neutro</b>: não soma nem tira, e <b>não quebra</b> a sequência de vitórias nem de derrotas.'],
        ["pt-gold", "👑", "Campeão do trimestre", 'Cada título soma <b>+0,5</b> na nota — para sempre.'],
        ["pt-miss", "⚽💨", "Faltou (escalado e não foi)", 'Tira <b>−0,1</b> e <b>zera</b> a sequência de vitórias. Quem não foi escalado não perde nada.'],
        ["pt-lock", "🔒", "Limites", 'A nota fica sempre entre <b>6,0</b> (piso) e <b>10,0</b> (teto).'],
      ];
      const itens = regras.map(([cls, ic, tit, txt]) =>
        '<div class="pt-item ' + cls + '"><span class="pt-ic">' + ic + '</span>' +
        '<div class="pt-txt"><b>' + tit + "</b><p>" + txt + "</p></div></div>"
      ).join("");
      return '<div class="pontuacao">' +
        '<div class="pt-head"><h3>📊 Como funciona a nota</h3><p>Do 6,0 ao 10,0 — o desempenho em campo é que manda</p></div>' +
        '<div class="pt-base"><span class="pt-base-num">6,0</span><span class="pt-base-txt">Todo jogador começa aqui. A partir daí, cada rodada mexe na nota conforme o resultado.</span></div>' +
        '<div class="pt-grid">' + itens + "</div>" +
        '<div class="pt-nota-fim">O ranking é <b>vitalício</b>: a nota atravessa os trimestrais e o desempate é por nota → vitórias → sequência.</div>' +
        "</div>";
    }

    function renderDestaques(e, lista, camp) {
      const itens = G().destaques(lista, camp);
      if (!itens.length) return "";
      const cards = itens.map((d, i) =>
        '<div class="dest ' + d.cls + '" ' + delay(i) + '">' +
        '<div class="dest-top"><span class="dest-ic">' + d.ic + '</span><span class="dest-rot">' + d.rot + "</span></div>" +
        '<div class="dest-main"><div class="dest-info"><div class="dest-nome">' + G().esc(d.jogador) + '</div><div class="dest-leg">' + d.leg + "</div></div>" +
        '<span class="dest-val">' + d.valor + "</span></div></div>"
      ).join("");
      return '<div class="destaques"><div class="dest-head"><h3>🔥 Destaques da temporada</h3><p>Quem está brilhando no ranking · toque em um nome para ver a ficha</p></div>' +
        '<div class="dest-grid">' + cards + "</div></div>";
    }

    // Gráfico SVG da evolução da nota do jogador (área dourada + pontos coloridos por resultado).
    function graficoNota(pontos) {
      if (pontos.length < 2) return '<div class="fvazio">Precisa de pelo menos 2 rodadas para o gráfico.</div>';
      const W = 320, H = 120, padL = 24, padR = 8, padT = 10, padB = 16;
      const notas = pontos.map((p) => p.nota);
      const min = Math.min.apply(null, notas), max = Math.max.apply(null, notas);
      const pad = Math.max(0.2, (max - min) * 0.25);
      let dMin = Math.max(6, Math.floor((min - pad) * 10) / 10);
      let dMax = Math.min(10, Math.ceil((max + pad) * 10) / 10);
      if (dMin === dMax) { dMin = Math.max(6, dMin - 0.3); dMax = Math.min(10, dMax + 0.3); }
      const iw = W - padL - padR, ih = H - padT - padB, base = padT + ih;
      const X = (i) => padL + (pontos.length === 1 ? iw / 2 : (i / (pontos.length - 1)) * iw);
      const Y = (v) => padT + (1 - (v - dMin) / (dMax - dMin)) * ih;
      const COR = { vitoria: "#4ade80", derrota: "#f87171", empate: "#e2e8f0", ausencia: "#fb923c" };
      const pts = pontos.map((p, i) => ({ x: X(i), y: Y(p.nota), r: p.resultado }));
      const line = pts.map((q, i) => (i ? "L" : "M") + q.x.toFixed(1) + " " + q.y.toFixed(1)).join(" ");
      const area = "M" + pts[0].x.toFixed(1) + " " + base.toFixed(1) + " " + pts.map((q) => "L" + q.x.toFixed(1) + " " + q.y.toFixed(1)).join(" ") + " L" + pts[pts.length - 1].x.toFixed(1) + " " + base.toFixed(1) + " Z";
      const niveis = [dMin, (dMin + dMax) / 2, dMax];
      const grid = niveis.map((v) => '<line x1="' + padL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(v).toFixed(1) + '" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 3"/>').join("");
      const yLab = niveis.map((v) => '<text x="' + (padL - 4) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end" font-size="7.5" fill="rgba(255,255,255,.4)">' + v.toFixed(1) + "</text>").join("");
      const dots = pts.map((q) => '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="3" fill="' + COR[q.r] + '" stroke="#0b1430" stroke-width="1.3"/>').join("");
      return '<svg class="graf-nota" viewBox="0 0 ' + W + " " + H + '">' +
        '<defs><linearGradient id="gnota" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></linearGradient></defs>' +
        grid + '<path d="' + area + '" fill="url(#gnota)"/><path d="' + line + '" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>' + dots + yLab + "</svg>" +
        '<div class="graf-leg"><span><i style="background:#4ade80"></i>Vitória</span><span><i style="background:#f87171"></i>Derrota</span><span><i style="background:#e2e8f0"></i>Empate</span><span><i style="background:#fb923c"></i>Faltou</span></div>';
    }

    function renderRodadas(e) {
      const nome = (id) => { const j = e.jogadores.find((x) => x.id === id); return j ? j.nome : "—"; };
      const rodadas = e.rodadas.filter((r) => r.resultado !== "andamento").sort((a, b) => (b.data || "").localeCompare(a.data || ""));
      if (!rodadas.length) return '<div class="board" style="background:transparent;border:0;box-shadow:none;padding:0"><div class="vazio">Nenhuma rodada disputada ainda.</div></div>';
      const cards = rodadas.map((r, i) => {
        const res = r.resultado === "vermelho" ? ["res-v", "Vermelho venceu", "venceu-v"] : r.resultado === "azul" ? ["res-a", "Azul venceu", "venceu-a"] : ["res-e", "Empate", ""];
        const lado = (time, cls, cor, titulo) => {
          const itens = time.map((id) => "<li><span>" + G().esc(nome(id)) + "</span></li>").join("");
          return '<div class="lado ' + cls + '"><b style="color:' + cor + '">' + titulo + "</b><ul>" + itens + "</ul></div>";
        };
        // Placar por time (número vermelho pro Vermelho, azul pro Azul). Só mostra se foi registrado.
        const temPlacar = r.placarVermelho !== null || r.placarAzul !== null;
        const placar = temPlacar
          ? '<div class="placar">' +
            '<span class="lado-time v"><span class="dot v"></span>Vermelho</span>' +
            '<span class="score"><span class="gv">' + (r.placarVermelho ?? 0) + '</span><span class="x">×</span><span class="ga">' + (r.placarAzul ?? 0) + "</span></span>" +
            '<span class="lado-time a">Azul<span class="dot a"></span></span></div>'
          : "";
        return '<div class="rodada ' + res[2] + '" ' + delay(i) + '">' +
          '<div class="rodada-top"><span class="data">📅 ' + G().esc(G().dataExt(r.data)) + '</span><span class="res ' + res[0] + '">' + res[1] + "</span></div>" +
          placar +
          '<div class="times2">' + lado(r.timeVermelho, "lado-v", "var(--red-l)", "🔴 Vermelho") + lado(r.timeAzul, "lado-a", "var(--blue-l)", "🔵 Azul") + "</div></div>";
      }).join("");
      return '<div class="rodadas">' + cards + "</div>";
    }

    function render(tab) {
      if (!ESTADO) return;
      const html = tab === "rodadas" ? renderRodadas(ESTADO) : tab === "ranking" ? renderRanking(ESTADO) : renderClassificacao(ESTADO);
      conteudo.innerHTML = '<div class="painel ativo">' + html + "</div>";
    }

    // ── Ficha do jogador (modal ao clicar no nome no ranking) ──
    const modalRoot = document.getElementById("modal-root");
    const RES = { vitoria: { l: "V", rot: "Vitória" }, derrota: { l: "D", rot: "Derrota" }, empate: { l: "E", rot: "Empate" } };

    function fecharFicha() {
      modalRoot.innerHTML = "";
      document.body.style.overflow = "";
    }

    function abrirFicha(id) {
      const linha = G().ranking(ESTADO).find((l) => l.jogador.id === id);
      if (!linha) return;
      const j = linha.jogador, s = linha.stats;
      const camp = G().campeoesPorId(ESTADO);
      const ehCampeao = !!camp[id];
      const partidas = G().partidasDoJogador(ESTADO, id);
      const aprov = s.j ? Math.round(((s.v * 3 + s.em) / (s.j * 3)) * 100) : 0;

      const seq = s.seq > 0
        ? '<span class="fseq v">' + G().seqBadge({ seq: s.seq, seqD: 0 }).replace(/^<span[^>]*>/, "").replace(/<\/span>$/, "") + " vitória" + (s.seq > 1 ? "s" : "") + " seguida" + (s.seq > 1 ? "s" : "") + "</span>"
        : s.seqD > 0
          ? '<span class="fseq d">' + G().seqBadge({ seq: 0, seqD: s.seqD }).replace(/^<span[^>]*>/, "").replace(/<\/span>$/, "") + " derrota" + (s.seqD > 1 ? "s" : "") + " seguida" + (s.seqD > 1 ? "s" : "") + "</span>"
          : '<span class="fseq flat">Sem sequência ativa</span>';

      const evol = G().evolucaoNota(ESTADO, id);
      const grafico = evol.length >= 2
        ? '<div class="ficha-sec"><div class="ficha-rot">Evolução da nota · ' + evol.length + ' rodadas</div>' + graficoNota(evol) + "</div>"
        : "";

      const forma = partidas.slice(0, 10).map((p) =>
        '<span class="selo r-' + RES[p.resultado].l + '" title="' + G().esc(G().dataBR(p.data)) + " · " + RES[p.resultado].rot + '">' + RES[p.resultado].l + "</span>"
      ).join("");

      const lista = partidas.length
        ? partidas.map((p) => {
            const temPlacar = p.golsPro !== null && p.golsContra !== null;
            const placar = temPlacar ? '<span class="pscore">' + p.golsPro + ' <span class="x">×</span> ' + p.golsContra + "</span>" : "";
            return '<div class="partida"><span class="chip c-' + RES[p.resultado].l + '">' + RES[p.resultado].l + "</span>" +
              '<span class="ptime"><span class="pdot ' + (p.time === "vermelho" ? "v" : "a") + '"></span>Time ' + (p.time === "vermelho" ? "Vermelho" : "Azul") + "</span>" +
              placar + '<span class="pdata">' + G().esc(G().dataBR(p.data)) + "</span></div>";
          }).join("")
        : '<div class="fvazio">Nenhuma partida registrada ainda.</div>';

      modalRoot.innerHTML =
        '<div class="ficha-overlay"><div class="ficha">' +
        '<button class="ficha-close" aria-label="Fechar">✕</button>' +
        '<div class="ficha-head">' +
        '<span class="ficha-posn">' + linha.pos + "</span>" +
        '<div class="ficha-id"><div class="ficha-meta">Gibs FC · Ficha</div>' +
        '<h3>' + G().esc(j.nome) + (ehCampeao ? G().coroa(camp, id) : "") + "</h3>" +
        '<div class="ficha-tags">' + tagPos(j.posicao) + (ehCampeao ? '<span class="ficha-tit">🏆 ' + camp[id] + "x campeão</span>" : "") + "</div></div>" +
        '<div class="ficha-nota"><b>' + s.nota.toFixed(1) + "</b><span>Nota</span></div>" +
        "</div>" +
        '<div class="ficha-body">' +
        '<div class="ficha-stats">' +
        '<div class="fstat"><b>' + s.j + "</b><span>Jogos</span></div>" +
        '<div class="fstat"><b class="ok">' + s.v + "</b><span>Vitórias</span></div>" +
        '<div class="fstat"><b class="bad">' + s.d + "</b><span>Derrotas</span></div>" +
        '<div class="fstat"><b>' + s.em + "</b><span>Empates</span></div>" +
        "</div>" +
        '<div class="ficha-linha">' + seq + '<span class="faprov"><b>' + aprov + "%</b> aprov.</span></div>" +
        grafico +
        (forma ? '<div class="ficha-sec"><div class="ficha-rot">Forma recente (mais recente primeiro)</div><div class="forma">' + forma + "</div></div>" : "") +
        '<div class="ficha-sec"><div class="ficha-rot">Últimas partidas</div><div class="partidas">' + lista + "</div></div>" +
        "</div></div></div>";

      document.body.style.overflow = "hidden";
      modalRoot.querySelector(".ficha-close").addEventListener("click", fecharFicha);
      modalRoot.querySelector(".ficha-overlay").addEventListener("click", (ev) => { if (ev.target.classList.contains("ficha-overlay")) fecharFicha(); });
    }

    // Clique nos nomes do ranking (delegação) e Esc para fechar.
    conteudo.addEventListener("click", (ev) => {
      const alvo = ev.target.closest(".nome-link");
      if (alvo && alvo.dataset.jogador) abrirFicha(alvo.dataset.jogador);
    });
    document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") fecharFicha(); });

    function irPara(tab) {
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("ativo", b.dataset.tab === tab));
      document.querySelectorAll(".masthead .link, .menu-mobile a").forEach((a) => a.classList.toggle("ativo", (a.getAttribute("href") || "").endsWith("#" + tab)));
      if (location.hash.slice(1) !== tab) history.replaceState(null, "", "#" + tab);
      render(tab);
    }

    document.querySelectorAll(".tabs button").forEach((btn) => btn.addEventListener("click", () => irPara(btn.dataset.tab)));
    window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (["classificacao", "rodadas", "ranking"].includes(t)) irPara(t); });

    GIBS.carregar().then((estado) => {
      ESTADO = estado;
      const inicial = ["classificacao", "rodadas", "ranking"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "classificacao";
      irPara(inicial);
      document.getElementById("updated").textContent = "Atualizado em " + new Date().toLocaleString("pt-BR");
    }).catch(() => { conteudo.innerHTML = '<div class="estado">Não foi possível carregar os dados. Tente novamente mais tarde.</div>'; });
  </script>
</body>
</html>
